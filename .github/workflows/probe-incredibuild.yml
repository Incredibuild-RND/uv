name: probe-incredibuild
# Diagnostic-only workflow. Runs both on incredibuild-runner and on
# ubuntu-latest and prints exhaustive environment + tool inventory so
# we can pinpoint exactly where Incredibuild's runner image differs
# from a stock GitHub-hosted Linux runner. Triggered manually only.

on:
  workflow_dispatch:
  # Also trigger on changes to this file so we can iterate without
  # needing the workflow to live on the default branch (GitHub's
  # workflow_dispatch only registers workflows from default branch).
  push:
    paths:
      - .github/workflows/probe-incredibuild.yml

permissions: {}

jobs:
  probe-ib:
    name: "probe on incredibuild-runner"
    runs-on: incredibuild-runner
    timeout-minutes: 10
    steps:
      - name: "Identity"
        run: |
          echo "=== whoami / id ==="
          id; whoami
          echo "=== uname ==="
          uname -a
          echo "=== /etc/os-release ==="
          cat /etc/os-release || true
          echo "=== cgroup ==="
          cat /proc/1/cgroup 2>/dev/null | head -5 || true
          echo "=== runner env ==="
          env | grep -iE "^(RUNNER_|GITHUB_|IB_|INCREDIBUILD_)" | sort

      - name: "PATH and ib-accel interception"
        run: |
          echo "=== PATH ==="
          echo "$PATH" | tr ':' '\n'
          echo "=== ib-accel binaries ==="
          ls -la /ib-workspace/incredibuild/ib-accel/bin 2>/dev/null || echo "(ib-accel/bin not present)"
          echo "=== which docker (which one wins) ==="
          which -a docker || true
          ls -la "$(which docker)" 2>/dev/null || true

      - name: "Tool inventory (presence + version)"
        run: |
          for tool in bash zsh sh git curl wget unzip jq sudo apt-get \
                      docker buildx qemu-system-aarch64 binfmt-support \
                      node npm npx python3 python pip rustup cargo rustc clippy \
                      cmake make gcc g++ ld ld.lld gold mold \
                      tar gzip xz unrar zip 7z openssl gpg \
                      ssh systemctl losetup; do
            if command -v "$tool" >/dev/null 2>&1; then
              v=$(timeout 3 "$tool" --version 2>&1 | head -1 || echo "(no --version)")
              printf "  ✅ %-22s %s\n" "$tool" "$v"
            else
              printf "  ❌ %-22s MISSING\n" "$tool"
            fi
          done

      - name: "Kernel features"
        run: |
          echo "=== /dev/loop* ==="
          ls -la /dev/loop* 2>/dev/null || echo "(no loop devices)"
          echo "=== /dev/kvm ==="
          ls -la /dev/kvm 2>/dev/null || echo "(no kvm)"
          echo "=== binfmt_misc ==="
          ls /proc/sys/fs/binfmt_misc/ 2>/dev/null | head -10 || echo "(no binfmt_misc)"
          echo "=== capabilities ==="
          grep -i cap /proc/self/status | head -5 || true
          echo "=== /proc/self/uid_map ==="
          cat /proc/self/uid_map 2>/dev/null || true

      - name: "Docker probe (this is where ib-accel intercepts)"
        run: |
          if ! command -v docker >/dev/null 2>&1; then
            echo "(no docker binary)"
            exit 0
          fi
          echo "=== docker version ==="
          docker version 2>&1 | head -30 || true
          echo
          echo "=== docker info ==="
          docker info 2>&1 | head -40 || true
          echo
          echo "=== docker buildx version ==="
          docker buildx version 2>&1 || echo "(no buildx)"
          echo
          echo "=== try: docker run --rm hello-world ==="
          docker run --rm hello-world 2>&1 | tail -20 || echo "(hello-world failed: $?)"
          echo
          echo "=== try: docker buildx ls ==="
          docker buildx ls 2>&1 || echo "(buildx ls failed)"

      - name: "ib-accel direct invocation"
        run: |
          if [ -x /ib-workspace/incredibuild/ib-accel/bin/docker ]; then
            echo "=== ib-accel docker --version ==="
            /ib-workspace/incredibuild/ib-accel/bin/docker --version 2>&1 || true
            echo "=== ib-accel docker info ==="
            /ib-workspace/incredibuild/ib-accel/bin/docker info 2>&1 | head -30 || true
          else
            echo "(no ib-accel docker wrapper)"
          fi

      - name: "Cargo cache layout"
        run: |
          echo "=== /ib-workspace ==="
          ls -la /ib-workspace 2>/dev/null || echo "(no /ib-workspace)"
          echo "=== /ib-workspace/cache ==="
          ls -la /ib-workspace/cache 2>/dev/null || true
          echo "=== /ib-workspace/cache/cargo-target (size) ==="
          du -sh /ib-workspace/cache/cargo-target 2>/dev/null || true
          echo "=== \$CARGO_HOME / \$CARGO_TARGET_DIR ==="
          echo "CARGO_HOME=${CARGO_HOME:-(unset)}"
          echo "CARGO_TARGET_DIR=${CARGO_TARGET_DIR:-(unset)}"

  probe-gh:
    name: "probe on ubuntu-latest (control)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "Same identity probe"
        run: |
          id; whoami; uname -a
      - name: "Tool inventory (presence)"
        run: |
          for tool in bash node npm npx python3 rustup cargo \
                      docker buildx qemu-system-aarch64 \
                      curl wget unzip jq sudo losetup; do
            if command -v "$tool" >/dev/null 2>&1; then
              v=$(timeout 3 "$tool" --version 2>&1 | head -1)
              printf "  ✅ %-22s %s\n" "$tool" "$v"
            else
              printf "  ❌ %-22s MISSING\n" "$tool"
            fi
          done
      - name: "Docker probe"
        run: |
          docker version 2>&1 | head -30
          docker buildx version
          docker run --rm hello-world 2>&1 | tail -20
      - name: "Kernel features"
        run: |
          ls -la /dev/loop* 2>/dev/null
          ls -la /dev/kvm 2>/dev/null
          ls /proc/sys/fs/binfmt_misc/ 2>/dev/null | head -10
