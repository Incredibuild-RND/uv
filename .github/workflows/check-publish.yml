on:
  workflow_call:

permissions: {}

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: 10

jobs:
  cargo-publish-dry-run:
    timeout-minutes: 20
    runs-on: incredibuild-runner
    name: "cargo publish dry-run"
    env:
      # Per-job CARGO_HOME / CARGO_TARGET_DIR. Without this the IB
      # runner shares /ib-workspace/cache/cargo* across concurrent
      # jobs, leading to NUL-byte source corruption (indexmap,
      # rkyv_derive). ib_console build cache (separate) still
      # accelerates compile.
      CARGO_HOME: ${{ github.workspace }}/.cargo
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: "cargo publish dry-run"
        # Plain cargo here — ib_console crashes mid-run on this
        # workspace-wide dry-run with the same exit-101 pattern we
        # see on cargo nextest run; appears to be ib_console's limit
        # for sustained workspace-scale compilation under
        # --build-cache-force. Unwrapping until IB resolves.
        run: cargo publish --workspace --dry-run
